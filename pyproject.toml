[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rce-harness"
version = "0.1.0"
description = "CLI for starting, sideloading to, and stopping Roku Cloud Emulator devices"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27",
  "tomli>=2; python_version < \"3.11\"",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21"]

[project.scripts]
rce = "rce_harness.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rce_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
